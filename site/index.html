<body>
<header>
  <h1 id="home-link" style="cursor:pointer" title="回首頁">每日股票型態確認</h1>

  <div class="hr"><form id="sf" class="sf" autocomplete="off"><input id="sq" type="search" enterkeyhint="search" placeholder="自訂搜尋：台積電 2330 聯亞…"><button class="btn" type="submit">搜尋</button></form><div id="idx"></div><nav><a href="#" id="n-home">族群統計</a><a href="#scr" id="n-scr">篩選</a><a href="#mydraw" id="n-draw" style="display:none">我的畫線✏️</a><a href="/admin/" id="n-mkt">管理者專區</a></nav><div class="fz"><span class="mute">字體</span><button class="btn" id="fzm" title="縮小字體">A−</button><button class="btn" id="fzp" title="放大字體">A＋</button></div></div>
  <p class="mute" style="flex-basis:100%;margin:0;font-size:13px">每日收盤後自動更新，依族群統計台股有多少檔轉強、弱轉強、型態好、盤整、走弱，並在 K 線圖上標出盤整區間與突破訊號。</p>

<footer class="wrap mute" style="font-size:12px;padding-bottom:40px">資料來源：證交所、櫃買中心盤後資料（價格未做除權息還原）。本站內容由程式自動計算，僅供研究與資訊參考，不構成任何投資建議；型態判定為系統規則，可能與實際看盤有落差，請自行判斷、風險自負。</footer>
<script src="data.js"></script>
<script>
const D = window.DATA;
const STATES = ["轉強","弱轉強","型態好","盤整","走弱"];
const CLS = {"轉強":"strong","弱轉強":"wstrong","型態好":"good","盤整":"range","走弱":"weak"};
const $ = s => document.querySelector(s);
const AM=D.asofM||{};
$("#asof").textContent = D.live ? `型態依 ${D.live.date.slice(5)} ${D.live.hms} 盤中價格計算（每 10 分鐘更新）` : (AM.TWSE&&AM.TPEX&&AM.TWSE!==AM.TPEX) ? `資料日期　上市 ${AM.TWSE.slice(5)}・上櫃 ${AM.TPEX.slice(5)}` : "資料日期 " + D.asof;

/* ───────── 共用 ───────── */
function badge(s,sub){return `<span class="badge b-${CLS[s]}">${s}</span>` + (sub?`<span class="tag ${sub==="破底走弱"?"bad":""}">${sub}</span>`:"")}
function tagCls(x){
  if(/突破第1根|準備突破|強勢止跌反彈|蓄勢待發/.test(x)) return "hot";
  if(/破底走弱|跌破/.test(x)) return "bad";
  if(/底|頂|杯柄|楔|三角|吞沒|刺透|烏雲|星|傘形|錘|烏鴉/.test(x)) return "pat";
  return "";
}
function tags(t){return (t||[]).map(x=>`<span class="tag ${tagCls(x)}">${x}</span>`).join("")}
function pct(n,t){return t? (n/t*100).toFixed(0)+"%":"-"}
function chgColor(v){return v>0?"var(--up)":v<0?"var(--down)":"var(--fg)"}
function fmt(v){return v==null?"-":(v>=1000?v.toFixed(0):v>=100?v.toFixed(1):v.toFixed(2))}
function stockBars(s){const US=D.market==="US"&&s.market==="US";return s.bars.map(r=>({d:typeof r[0]==="string"?r[0]:D.dates[r[0]],o:r[1],h:r[2],l:r[3],c:r[4],v:US?r[5]*1000*r[4]:r[5],f:r[6]==null?1:r[6]}))}   // 美股：成交值（美元）＝千股×1000×收盤
function fmtUSD(v){return v>=1e8?(v/1e8).toFixed(1)+" 億":v>=1e7?(v/1e7).toFixed(1)+" 千萬":(v/1e6).toFixed(1)+" 百萬"}

/* ───────── 右上角：台股大盤 ───────── */
/* ───────── 台指期：交易時段與即時資料 ───────── */
function twNow(){const p=new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Taipei",weekday:"short",hour:"2-digit",minute:"2-digit",hour12:false,year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date()).reduce((a,x)=>(a[x.type]=x.value,a),{});return {wd:p.weekday,m:(+p.hour%24)*60+ +p.minute,date:`${p.year}-${p.month}-${p.day}`}}
function txSession(){            // "day" 日盤 08:45–13:45、"night" 夜盤 15:00–隔天 05:00、null 休息
  const t=twNow(),wk=!/Sat|Sun/.test(t.wd);
  if(wk&&t.m>=525&&t.m<=825) return "day";
  if((wk&&t.m>=900)||(t.m<300&&!/Sun|Mon/.test(t.wd))) return "night";
  return null;
}
function nextWeekday(d){const t=new Date(d+"T00:00:00Z");do{t.setUTCDate(t.getUTCDate()+1)}while([0,6].includes(t.getUTCDay()));return t.toISOString().slice(0,10)}
const ymd=x=>x&&x.length===8?`${x.slice(0,4)}-${x.slice(4,6)}-${x.slice(6)}`:null;
const hms=x=>x&&x.length>=6?`${x.slice(0,2)}:${x.slice(2,4)}:${x.slice(4,6)}`:"";
let txLive=null;                  // 最近一次 /api/tx 的結果
async function fetchTX(){try{const r=await fetch("/api/tx",{cache:"no-store"});if(!r.ok)return null;const j=await r.json();if(j&&(j.day||j.night))txLive=j;return txLive}catch(_){return null}}
function txBar(j,mode){           // 由即時資料組今天（交易日）的 K 棒；mode：all 全盤（夜盤＋日盤）／day 日盤／night 夜盤
  const d=j.day,n=j.night,ok=q=>q&&q.o>0&&q.h>0&&q.l>0&&q.c>0;
  const dd=ok(d)?ymd(d.date):null, nd=ok(n)?nextWeekday(ymd(n.date)):null;     // 夜盤算在下一個交易日
  if(mode==="night"){ return nd?{d:nd,o:n.o,h:n.h,l:n.l,c:n.c,v:n.v,f:1}:null }
  if(mode==="day"){ if(!dd) return null; const nv=nd===dd?n.v:0; return {d:dd,o:d.o,h:d.h,l:d.l,c:d.c,v:Math.max(0,d.v-nv),f:1} }
  if(nd&&(!dd||nd>dd)) return {d:nd,o:n.o,h:n.h,l:n.l,c:n.c,v:n.v,f:1};
  if(dd){ if(nd===dd) return {d:dd,o:n.o,h:Math.max(n.h,d.h),l:Math.min(n.l,d.l),c:d.c,v:d.v,f:1}; return {d:dd,o:d.o,h:d.h,l:d.l,c:d.c,v:d.v,f:1} }
  return null;
}
function txQuote(j){              // 標籤用：目前時段的最新價、漲跌與價差
  const ses=txSession(), useN=ses==="night"||(!ses&&j.night&&j.night.c>0&&twNow().m<525), q=useN?j.night:j.day;
  if(!q||!(q.c>0)) return null;
  const spot=useN?(j.spotNight&&j.spotNight.ref):(j.spot&&(j.spot.c||j.spot.ref));
  return {c:q.c,ref:q.ref,ses:useN?"夜盤":"日盤",time:hms(q.time),basis:spot?q.c-spot:null,id:q.id};
}

function findStocks(token){
  const t=token.trim().toLowerCase(); if(!t) return [];
  const all=Object.values(D.stocks);
  let hit=all.filter(s=>s.code.toLowerCase()===t);
  if(!hit.length) hit=all.filter(s=>s.name.toLowerCase()===t);
  if(!hit.length) hit=all.filter(s=>s.code.toLowerCase().startsWith(t)||s.name.toLowerCase().includes(t)).slice(0,3);

function finder(q){
  const tokens=q.split(/[\s,，、;；]+/).filter(Boolean);

  const seen=new Set(), miss=[];
  for(const tk of tokens){

  $("#app").innerHTML=h; bindRows();
  $("#app").insertAdjacentHTML("beforeend",`<div style="height:75vh"></div>`);   // 讓最後面的結果也能捲到最上方

function startLive(c,sym,isIndex){

function wkKey(d){const t=new Date(d+"T00:00:00Z");t.setUTCDate(t.getUTCDate()-((t.getUTCDay()+6)%7));return t.toISOString().slice(0,10)}
function aggregate(bars, tf){
  if(tf==="D") return bars.map(b=>({...b,s:b.d}));
  const key = tf==="W"? wkKey : (d=>d.slice(0,7));
  const out=[]; let k=null;
  for(const b of bars){
    const kk=key(b.d);
    if(kk!==k){out.push({d:b.d,s:b.d,o:b.o,h:b.h,l:b.l,c:b.c,v:b.v});k=kk}
    else{const x=out[out.length-1];x.d=b.d;x.h=Math.max(x.h,b.h);x.l=Math.min(x.l,b.l);x.c=b.c;x.v+=b.v}
  }
  return out;
}
function sma(a,n){const o=[];let s=0;a.forEach((v,i)=>{s+=v;if(i>=n)s-=a[i-n];o.push(i>=n-1?s/n:null)});return o}
function idxOf(bars, date){
  let lo=0,hi=bars.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1;if(bars[m].s<=date){r=m;lo=m+1}else hi=m-1}
  return r;
}
const TF_N = {D:110,W:90,M:36};
function ema(a,n){const k=2/(n+1);let p=null;return a.map(v=>(p=p==null?v:v*k+p*(1-k)))}
function calcBoll(bars,n=20,m=2){
  const c=bars.map(b=>b.c),mid=sma(c,n);
  return mid.map((mv,i)=>{if(mv==null)return null;let s=0;for(let j=i-n+1;j<=i;j++)s+=(c[j]-mv)**2;const sd=Math.sqrt(s/n);return{m:mv,u:mv+m*sd,l:mv-m*sd}});
}
function calcMACD(bars){
  const c=bars.map(b=>b.c),e12=ema(c,12),e26=ema(c,26),dif=c.map((_,i)=>e12[i]-e26[i]),dea=ema(dif,9);
  return{dif,dea,hist:dif.map((v,i)=>v-dea[i])};
}
function calcKD(bars,n=9){
  let k=50,d=50;const K=[],Dd=[];
  bars.forEach((b,i)=>{let hh=-1e18,ll=1e18;for(let j=Math.max(0,i-n+1);j<=i;j++){hh=Math.max(hh,bars[j].h);ll=Math.min(ll,bars[j].l)}
    const rsv=hh===ll?50:(b.c-ll)/(hh-ll)*100;k=2/3*k+rsv/3;d=2/3*d+k/3;K.push(k);Dd.push(d)});
  return{K,D:Dd};
}
// KD 鈍化：K 值連續 ≥3 日在 80 以上＝高檔鈍化；連續 ≥3 日在 20 以下＝低檔鈍化
function kdRuns(K,minLen=3,hiTh=80,loTh=20){
  const segs=[];let a=-1,t=null;
  const flush=i=>{if(a>=0&&i-a>=minLen)segs.push({a,b:i-1,t});a=-1;t=null};
  for(let i=0;i<K.length;i++){
    const ty=K[i]>=hiTh?"hi":K[i]<=loTh?"lo":null;
    if(ty!==t){flush(i);if(ty){a=i;t=ty}}
  }
  flush(K.length);
  return segs;
}
function calcDMI(bars,n=14){
  const N=bars.length,pdi=Array(N).fill(null),mdi=Array(N).fill(null),adx=Array(N).fill(null);
  if(N<=n*2) return{pdi,mdi,adx};
  const P=[],M=[],T=[];
  for(let i=1;i<N;i++){const up=bars[i].h-bars[i-1].h,dn=bars[i-1].l-bars[i].l;
    P[i]=up>dn&&up>0?up:0;M[i]=dn>up&&dn>0?dn:0;
    T[i]=Math.max(bars[i].h-bars[i].l,Math.abs(bars[i].h-bars[i-1].c),Math.abs(bars[i].l-bars[i-1].c))}
  let sp=0,sm=0,st=0;for(let i=1;i<=n;i++){sp+=P[i];sm+=M[i];st+=T[i]}
  const dx=[];
  for(let i=n;i<N;i++){
    if(i>n){sp=sp-sp/n+P[i];sm=sm-sm/n+M[i];st=st-st/n+T[i]}
    pdi[i]=st?100*sp/st:0;mdi[i]=st?100*sm/st:0;
    dx[i]=(pdi[i]+mdi[i])?100*Math.abs(pdi[i]-mdi[i])/(pdi[i]+mdi[i]):0;
  }
  let a=0;for(let i=n;i<2*n;i++)a+=dx[i];a/=n;adx[2*n-1]=a;
  for(let i=2*n;i<N;i++){a=(a*(n-1)+dx[i])/n;adx[i]=a}
  return{pdi,mdi,adx};
}
function adjustBars(raw){ return raw.map(b=>b.f===1?b:{...b,o:b.o*b.f,h:b.h*b.f,l:b.l*b.f,c:b.c*b.f}) }
/* 支撐：先看畫面內最近 60 根，沒有已確認支撐才看到畫面最左邊。
   前低＝最低價比前後各 5 根都低；回測＝之後最低價落在前低以上 3% 內、或刺破前低但收盤仍在前低之上（且距上次觸及至少 5 根）；
   收盤價低於前低＝跌破（作廢）。已確認＝至少回測 1 次且到最新一根都沒破。有多條只取股價下方最近的一條。 */
function findSupport(B,vs,e){
  if(e<10) return null;
  const lastC=B[e].c;
  const scan=a=>{
    let best=null;
    for(let j=Math.max(a,5);j<=e-5;j++){
      const L=B[j].l; let ok=true;
      for(let k=j-5;k<=j+5;k++){ if(k!==j&&B[k].l<L){ok=false;break} }
      if(!ok) continue;
      let broken=false,touches=1,last=j;
      for(let i=j+1;i<=e;i++){
        if(B[i].c<L){broken=true;break}
        const hit=B[i].l<L||B[i].l<=L*1.03;
        if(hit&&i-last>=5){touches++;last=i}
      }
      if(broken||touches<2||!(L<lastC)) continue;
      if(!best||L>best.L) best={L,j,touches,e};
    }
    return best;
  };
  return scan(Math.max(vs,e-59))||scan(vs);
}
function calcStats(B,i0,i1){
  i0=Math.max(0,i0);i1=Math.min(B.length-1,i1);if(i1<=i0) return null;
  let hi=-1e18,hiI=i0,lo=1e18,loI=i0;
  for(let i=i0;i<=i1;i++){if(B[i].h>hi){hi=B[i].h;hiI=i}if(B[i].l<lo){lo=B[i].l;loI=i}}
  // 前波低：從最高點往前找最近的波段低點，且必須比高點之後的最低價還低（還沒被跌破的前低）
  let postLo=1e18;for(let i=hiI;i<=i1;i++)if(B[i].l<postLo)postLo=B[i].l;
  let swing=null,fb=null;
  for(let j=hiI-2;j>=i0+2;j--){let ok=true;for(let k=j-2;k<=j+2;k++)if(B[k].l<B[j].l){ok=false;break}if(!ok)continue;if(fb==null)fb=j;if(B[j].l<postLo){swing=j;break}}

  let peak=B[s0].h,peakI=s0,dd=0,ddA=s0,ddB=s0;
  for(let i=s0;i<=i1;i++){

    const r=B[i].l/peak-1;if(r<dd){dd=r;ddA=peakI;ddB=i}
  }
  const last=B[i1].c;
  return{hi,hiI,lo,loI,dd,ddA,ddB,fromHi:last/hi-1,fromLo:last/lo-1,swing,n:i1-i0+1};
}

    else { rb.dataset.form=""; rb.innerHTML=((this.isAdmin&&(this.drawings||[]).length)?`<div class="chips">${this.drawings.map(d=>`<span class="chip2"><span class="btn" style="cursor:default;color:#ff5fd2" title="${(d.note||"").replace(/"/g,"")}">✏️ ${d.name}</span><button class="btn" data-a="drdel-${d.id}" title="刪除這條線">×</button></span>`).join("")}</div>`:"")+((this.cboxes||[]).length?`<div class="chips">${this.cboxes.map((c,i)=>`<span class="chip2"><span class="btn" style="cursor:default;color:#fb923c">自訂框 ${MD(c.from)}～${MD(c.to)}　${fmt(c.lo)}–${fmt(c.hi)}</span><button class="btn" data-a="cbdel-${i}" title="刪除這個框">×</button></span>`).join("")}</div>`:""); }
    rb.querySelectorAll("[data-a]").forEach(el=>el.onclick=()=>this.act(el.dataset.a));
    // 右側：統計
    let a=vs,b=ve-1,tag="目前畫面";
    if(this.range){a=Math.min(this.range.a,this.range.b);b=Math.max(this.range.a,this.range.b);tag="剪刀選取"}
    else if(this.active){a=idxOf(B,this.active.from);b=idxOf(B,this.active.to);tag="自訂區間"}
    const st=calcStats(B,a,b);
    this.el.querySelector("#stats").innerHTML=st?`<div class="mute" style="font-size:11px;margin-bottom:2px">統計範圍：${tag}（${MD(B[a].s)} ～ ${MD(B[b].d)}）</div>
      <div>最高 <b>${fmt(st.hi)}</b> ${MD(B[st.hiI].d)}　最低 <b>${fmt(st.lo)}</b> ${MD(B[st.loI].d)}</div>
      <div>最大回調 <b style="color:var(--down)">${(st.dd*100).toFixed(2)}%</b> ${MD(B[st.ddA].d)}→${MD(B[st.ddB].d)}</div>
      <div>距高 <b style="color:var(--down)">${(st.fromHi*100).toFixed(2)}%</b>　距低 <b style="color:var(--up)">+${(st.fromLo*100).toFixed(2)}%</b></div>
      ${this.sup&&this.supRes?(this.supRes.front?`<div style="color:#38bdf8">前低支撐 <b>${fmt(this.supRes.front.L)}</b>（${MD(B[this.supRes.front.i].d)}）</div>`:"")+(this.supRes.recent?`<div style="color:#ff8a8a">近期支撐 <b>${fmt(this.supRes.recent.L)}</b>（${MD(B[this.supRes.recent.i].d)}）</div>`:"")+(!this.supRes.front&&!this.supRes.recent?`<div class="mute">尚無支撐</div>`:""):""}`:"";
    // 右側：均線數值（隨選取的 K 棒）
    const lv=MA_ALL.filter(n=>this.maOn[n]).map(n=>`<span style="color:${MA_COL[n]}">${n}日 <b>${f2(this.ma[n][cur])}</b></span>`);
    if(this.ind.boll){const bb=this.get("boll")[cur];if(bb)lv.push(`<span style="color:#209A43">布林 上 <b>${f2(bb.u)}</b> 中 <b>${f2(bb.m)}</b> 下 <b>${f2(bb.l)}</b></span>`)}
    this.el.querySelector("#legendv").innerHTML=lv.join("");
  }
}


/* ───────── 我的畫線（管理者）：台股＋美股所有畫過線的股票，目前市場的排前面 ───────── */
async function myDraw(){
  $("#app").innerHTML=`<button class="btn back" onclick="location.hash=''">← 全部族群</button><h2 style="margin:4px 0 6px">我的畫線✏️</h2><p class="note">讀取中…</p>`;
  let all=null; try{ const r=await fetch("/api/draw-list?all=1",{cache:"no-store"}); all=await r.json() }catch(_){}
  if(location.hash!=="#mydraw") return;
  if(!all||!all.TW){ $("#app").innerHTML=`<button class="btn back" onclick="location.hash=''">← 全部族群</button><h2>我的畫線✏️</h2><p class="note">請先登入管理者專區。</p>`; return }
  const here=D.market==="US"?"US":"TW", order=[here, here==="US"?"TW":"US"];
  let h=`<button class="btn back" onclick="location.hash=''">← 全部族群</button><h2 style="margin:4px 0 6px">我的畫線✏️</h2><p class="note" style="margin-top:0">管理者畫過型態線的股票，點股票看 K 線圖（另一個市場的會換頁打開）。標「型態已更新！」的：系統已經把你畫的型態往後補完，確認後可以刪掉自己的線。</p>`;
  for(const m of order){
    const codes=Object.keys(all[m]||{}), nm=m==="US"?"美股":"台股";
    h+=`<h3 style="margin:18px 0 6px">${nm}　<span class="mute">${codes.length} 檔</span></h3>`;
    if(!codes.length){ h+=`<p class="note">還沒有畫線。</p>`; continue }
    const sameMkt=m===here, list=codes.map(c=>({c,s:sameMkt?D.stocks[c]:null,names:all[m][c]})).sort((a,b)=>((b.s?b.s.close*b.s.vol:0)-(a.s?a.s.close*a.s.vol:0))||a.c.localeCompare(b.c));
    h+=`<div class="tw"><table class="stt"><thead><tr><th>股票</th><th class="tg">我畫的型態</th><th class="cc">型態</th><th class="cc">收盤</th><th class="cc">漲跌%</th></tr></thead><tbody>`;
    for(const x of list){
      const href=sameMkt?"":(m==="US"?"/admin/#s-":"/#s-")+encodeURIComponent(x.c), s=x.s;
      h+=`<tr class="row" ${sameMkt?`data-c="${x.c}"`:`data-href="${href}"`}><td class="sn1"><b>${x.c}</b> <span class="sn">${s?s.name:""}</span></td><td class="tg">${x.names.map(n=>`<span class="tag" style="color:#f472b6;border-color:#f472b688">✏️${n||"未命名"}</span>`).join("")}${s&&s.drawUpd&&s.drawUpd.length?`<span class="tag hot" title="系統已經把這段型態往後補完，可以點進去確認後刪掉自己畫的線">型態已更新！</span>`:""}</td>`+
        (s?`<td class="cc ty"><span class="badge b-${CLS[s.state]}">${s.state}</span></td><td class="cc">${s.close}</td><td class="cc" style="color:${chgColor(s.chg)}">${s.chg>0?"+":""}${s.chg}</td>`:`<td class="cc mute" colspan="3">點開看（${nm}頁）</td>`)+`</tr>`;
    }
    h+=`</tbody></table></div>`;
  }
  $("#app").innerHTML=h; bindRows();
  document.querySelectorAll("tr.row[data-href]").forEach(r=>r.onclick=()=>{location.href=r.dataset.href});
}

/* ───────── 路由 ───────── */
let baseRaw=null;                 // 目前底層頁面的 hash（列表頁）
function renderBase(h){
  baseRaw=h;
  $("#n-home").classList.toggle("on", !h.startsWith("scr")&&h!=="mydraw");
  $("#n-scr").classList.toggle("on", h.startsWith("scr"));
  $("#n-draw").classList.toggle("on", h==="mydraw");
  if(h.startsWith("g-")) group((D.groups[+h.slice(2)]||{}).name);
  else if(h.startsWith("find-")) finder(h.slice(5));
  else if(h.startsWith("st-")) stateList(h.slice(3));
  else if(h.startsWith("scr")) screener(h.slice(4));
  else if(h==="mydraw") myDraw();
  else home();
}
function goBack(){
  const h = decodeURIComponent(location.hash.slice(1));
  if(h.startsWith("s-")||h.startsWith("i-")) location.hash = baseRaw || "";
  else if(h.startsWith("g-") || h.startsWith("scr-") || h.startsWith("find-") || h.startsWith("st-") || h==="mydraw") location.hash = "";
}
document.addEventListener("keydown",e=>{
  if(e.key!=="Escape") return;
  if(chart&&chart.cancelScissor&&chart.cancelScissor()) return;          // 剪刀進行中：ESC 只取消剪刀
  const h=decodeURIComponent(location.hash.slice(1));
  if(!h){ const q=$("#sq"); q.value=""; q.focus(); window.scrollTo(0,0); return }   // 已經在最上層：回到自訂搜尋框
  goBack();
});
function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  if(h.startsWith("s-")||h.startsWith("i-")){
    if(baseRaw===null){ renderBase(""); }
    if(h.startsWith("s-")) openStock(h.slice(2)); else openIndex(h.slice(2));
    return;
  }
  closeModal();
  if(baseRaw!==h){ renderBase(h); window.scrollTo(0,0); }
}

/* 上班模式、字體大小（記在瀏覽器裡） */
(function(){
  const get=(k,d)=>{try{return localStorage.getItem(k)??d}catch(_){return d}}, set=(k,v)=>{try{localStorage.setItem(k,v)}catch(_){}};
  let fz=Math.max(-3,Math.min(3,+get("fz",0)||0)), work=get("work","0")==="1";
  const apply=()=>{
    const z=1+fz*0.08;
    document.querySelector("header").style.zoom=z; $("#app").style.zoom=z;
    $("#fzm").disabled=fz<=-3; $("#fzp").disabled=fz>=3;
    document.documentElement.classList.toggle("work",work); $("#work").classList.toggle("on",work);
    const ic=work?{"favicon.ico":"icon-work-32.png","icon-32.png":"icon-work-32.png","icon-192.png":"icon-work-192.png","apple-touch-icon.png":"apple-touch-icon-work.png"}:{};
    document.querySelectorAll('link[rel="icon"],link[rel="apple-touch-icon"]').forEach(l=>{
      if(!l.dataset.o) l.dataset.o=l.getAttribute("href");
      const h=ic[l.dataset.o]||l.dataset.o; if(l.getAttribute("href")!==h){ if(h.endsWith(".png")) l.type="image/png"; l.setAttribute("href",h) }
    });
  };
  $("#fzm").onclick=()=>{fz=Math.max(-3,fz-1);set("fz",fz);apply()};
  $("#fzp").onclick=()=>{fz=Math.min(3,fz+1);set("fz",fz);apply()};
  $("#work").onclick=()=>{work=!work;set("work",work?"1":"0");apply()};
  apply();
})();

(function(){const h=document.querySelector("header"),f=()=>document.documentElement.style.setProperty("--hh",h.offsetHeight+"px");if(window.ResizeObserver)new ResizeObserver(f).observe(h);f()})();   // 型態標籤列貼在頁首下方
if(/(?:^|;\s*)adm=1/.test(document.cookie)) $("#n-draw").style.display="";   // 只有管理者看得到「我的畫線」
let stuckNow=false;
function setStuck(v){stuckNow=v;document.documentElement.classList.toggle("stuck",v)}
(function(){const f=()=>{const y=window.scrollY;if(!stuckNow&&y>60)setStuck(true);else if(stuckNow&&y<20)setStuck(false)};addEventListener("scroll",f,{passive:true});f()})();
/* 捲到結果：讓第一列剛好貼在固定標題列下方（先收合標題列再量高度，避免多捲） */
function scrollToFirstRow(){
  const row=document.querySelector("#app tr.row"); if(!row) return;
  requestAnimationFrame(()=>{
    setStuck(true);
    const H=document.querySelector("header").getBoundingClientRect().height;
    const y=Math.max(0,row.getBoundingClientRect().top+window.scrollY-H-4);
    window.scrollTo(0,y); if(y<=20) setStuck(false);
  });
}
