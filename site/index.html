/* ───────── 共用 ───────── */

/* ───────── 台指期：交易時段與即時資料 ───────── */
function twNow(){const p=new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Taipei",weekday:"short",hour:"2-digit",minute:"2-digit",hour12:false,year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date()).reduce((a,x)=>(a[x.type]=x.value,a),{});return {wd:p.weekday,m:(+p.hour%24)*60+ +p.minute,date:`${p.year}-${p.month}-${p.day}`}}
function txSession(){            // "day" 日盤 08:45–13:45、"night" 夜盤 15:00–隔天 05:00、null 休息
  const t=twNow(),wk=!/Sat|Sun/.test(t.wd);
  if(wk&&t.m>=525&&t.m<=825) return "day";
  if((wk&&t.m>=900)||(t.m<300&&!/Sun|Mon/.test(t.wd))) return "night";
  return null;
}
function nextWeekday(d){const t=new Date(d+"T00:00:00Z");do{t.setUTCDate(t.getUTCDate()+1)}while([0,6].includes(t.getUTCDay()));return t.toISOString().slice(0,10)}
const ymd=x=>x&&x.length===8?`${x.slice(0,4)}-${x.slice(4,6)}-${x.slice(6)}`:null;
const hms=x=>x&&x.length>=6?`${x.slice(0,2)}:${x.slice(2,4)}:${x.slice(4,6)}`:"";
let txLive=null;                  // 最近一次 /api/tx 的結果
async function fetchTX(){try{const r=await fetch("/api/tx",{cache:"no-store"});if(!r.ok)return null;const j=await r.json();if(j&&(j.day||j.night))txLive=j;return txLive}catch(_){return null}}
function txBar(j,mode){           // 由即時資料組今天（交易日）的 K 棒；mode：all 全盤（夜盤＋日盤）／day 日盤／night 夜盤
  const d=j.day,n=j.night,ok=q=>q&&q.o>0&&q.h>0&&q.l>0&&q.c>0;
  const dd=ok(d)?ymd(d.date):null, nd=ok(n)?nextWeekday(ymd(n.date)):null;     // 夜盤算在下一個交易日
  if(mode==="night"){ return nd?{d:nd,o:n.o,h:n.h,l:n.l,c:n.c,v:n.v,f:1}:null }
  if(mode==="day"){ if(!dd) return null; const nv=nd===dd?n.v:0; return {d:dd,o:d.o,h:d.h,l:d.l,c:d.c,v:Math.max(0,d.v-nv),f:1} }
  if(nd&&(!dd||nd>dd)) return {d:nd,o:n.o,h:n.h,l:n.l,c:n.c,v:n.v,f:1};
  if(dd){ if(nd===dd) return {d:dd,o:n.o,h:Math.max(n.h,d.h),l:Math.min(n.l,d.l),c:d.c,v:d.v,f:1}; return {d:dd,o:d.o,h:d.h,l:d.l,c:d.c,v:d.v,f:1} }
  return null;
}
function txQuote(j){              // 標籤用：目前時段的最新價、漲跌與價差
  const ses=txSession(), nOk=j.night&&j.night.c>0&&j.night.date, nNewer=nOk&&(!j.day||!j.day.date||j.night.date>=j.day.date);      // 休市時：夜盤比日盤新（例：週五夜盤收在週六凌晨 5 點）就顯示夜盤收盤
  const useN=ses==="night"||(!ses&&nNewer), q=useN?j.night:j.day;
  if(!q||!(q.c>0)) return null;
  const spot=useN?(j.spotNight&&j.spotNight.ref):(j.spot&&(j.spot.c||j.spot.ref));
  return {c:q.c,ref:q.ref,ses:useN?"夜盤":"日盤",time:hms(q.time),basis:spot?q.c-spot:null,id:q.id};
}
const liveIdx={};   // 即時行情：{TWII:{...},OTC:{...}}
function renderIdx(){
  const ix=D.index||{}, el=$("#idx"); if(!el) return;
  let txh="";
  if(ix.TX&&ix.TX.bars.length>1){
    const b=ix.TX.bars,l=b[b.length-1],q=txLive&&txQuote(txLive);
    const price=q?q.c:l[4], ref=q&&q.ref?q.ref:b[b.length-2][4], ch=price-ref, pc=ch/ref*100;
    const basis=q&&q.basis!=null?`<span class="mute" style="font-size:11px">　價差 ${q.basis>0?"+":""}${q.basis.toFixed(0)}</span>`:"";

    txh=`<button class="ichip" data-i="TX" title="${q?q.ses+" "+q.time:l[0]}"><span class="mute">台指期</span> <b>${price.toLocaleString(undefined,{maximumFractionDigits:0})}</b>${lv}<br><span style="color:${chgColor(ch)}">${ch>0?"▲":ch<0?"▼":""}${Math.abs(ch).toFixed(0)}（${pc>0?"+":""}${pc.toFixed(2)}%）</span>${basis}</button>`;
  }
  el.innerHTML=txh+["TWII","OTC"].filter(k=>ix[k]&&ix[k].bars.length>1).map(k=>{
    const b=ix[k].bars,l=b[b.length-1],p=b[b.length-2],q=liveIdx[k];
    let price=l[4],ch=l[4]-p[4],base=p[4],tip=l[0],lv="";
    if(q&&q.date>=l[0]){ price=q.c; base=q.date>l[0]?l[4]:(q.prev||p[4]); ch=price-base; tip=q.date+" "+(q.hms||""); lv=` <small style="color:#f0d34a">${twMarketOpen()?"盤中":"即時"}</small>`}
    const pc=ch/base*100;
    return `<button class="ichip" data-i="${k}" title="${tip}"><span class="mute">${ix[k].name}</span> <b>${price.toLocaleString(undefined,{maximumFractionDigits:2})}</b>${lv}<br><span style="color:${chgColor(ch)}">${ch>0?"▲":ch<0?"▼":""}${Math.abs(ch).toFixed(2)}（${pc>0?"+":""}${pc.toFixed(2)}%）</span></button>`}).join("");
  el.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{const k=b.dataset.i,ses=txSession();location.hash="i-"+(k==="TX"?(ses==="night"?"TXN":ses==="day"?"TXD":"TX"):k)});
}
let idxTimer=null;
async function pollIdx(){
  clearTimeout(idxTimer);

  await Promise.all([["TWII","^TWII"],["OTC","^TWOII"]].filter(([k])=>ix[k]).map(async([k,sym])=>{
    try{const r=await fetch("/api/quote?s="+encodeURIComponent(sym),{cache:"no-store"});if(!r.ok)return;const q=await r.json();
      const b=ix[k].bars,l=b[b.length-1]; if(q&&q.date&&q.c>0&&q.date>=l[0]&&(q.date>l[0]||twMarketOpen())) liveIdx[k]=q}catch(_){}
  }));
  if(ix.TX) await fetchTX();
  renderIdx();
  const t=Object.values(liveIdx).map(q=>q.t).filter(Boolean).sort().pop(), q0=liveIdx.TWII||liveIdx.OTC;
  const base=D.live ? liveTxt() : (AM.TWSE&&AM.TPEX&&AM.TWSE!==AM.TPEX) ? `資料日期　上市 ${AM.TWSE.slice(5)}・上櫃 ${AM.TPEX.slice(5)}` : "資料日期 "+D.asof;
  $("#asof").innerHTML=base+(q0?`<span style="color:#f0d34a">　${twMarketOpen()?"盤中":"即時"} ${q0.date.slice(5)} ${q0.hms||""}</span>`:"");
  idxTimer=setTimeout(pollIdx,(twMarketOpen()||txSession())?10000:120000);

/* 加權指數今天漲跌幅：盤中用頁首的即時報價（liveIdx），否則用日 K 最後兩根 */
function twiiChg(){
  const b=((D.index||{}).TWII||{}).bars||[], q=liveIdx.TWII; if(b.length<2) return 0;
  const l=b[b.length-1], p=b[b.length-2];
  if(q&&q.c>0) return (q.c/(q.date>l[0]?l[4]:p[4])-1)*100;
  if(D.live&&D.live.date>l[0]) return null;      /* 盤中、即時報價還沒到：日 K 是昨天的，不要拿來用 */
  return (l[4]/p[4]-1)*100;
}
/* ───────── 強弱族群（盤後一眼看懂 第一塊）─────────
   Opus 顧問建議、使用者同意方向：族群內個股漲跌幅「中位數」排名；至少 5 檔（成交值太小的不算）；
   強要 ≥60% 上漲、弱要 ≥60% 下跌；兩個上榜族群成員重疊超過一半只留排名高的；強 5 弱 5。 */
function swGroups(){
  const MINV=1e7, med=a=>{const b=[...a].sort((x,y)=>x-y),m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2};
  const rows=[];
  for(const g of D.groups){
    const L=g.stocks.map(c=>D.stocks[c]).filter(s=>s&&s.chg!=null&&s.close*s.vol*1000>=MINV);
    if(L.length<5) continue;
    const ch=L.map(s=>s.chg), up=ch.filter(x=>x>0).length, dn=ch.filter(x=>x<0).length;
    const best=L.reduce((a,b)=>b.chg>a.chg?b:a), worst=L.reduce((a,b)=>b.chg<a.chg?b:a);
    rows.push({name:g.name,n:L.length,med:med(ch),up,dn,best,worst,set:new Set(g.stocks)});
  }
  const pick=(list,ok)=>{const out=[];for(const r of list){if(!ok(r))continue;
    if(out.some(o=>{let k=0;for(const c of r.set) if(o.set.has(c)) k++;return k>0.5*Math.min(r.set.size,o.set.size)})) continue;
    out.push(r);if(out.length>=5)break}return out};
  return {rows,strong:pick([...rows].sort((a,b)=>b.med-a.med),r=>r.up/r.n>=0.6&&r.med>0),
          weak:pick([...rows].sort((a,b)=>a.med-b.med),r=>r.dn/r.n>=0.6&&r.med<0)};
}
/* ───────── 盤後一眼看懂：大盤卡片（加權、櫃買：收盤、漲跌、幅度、成交金額；每張標資料日期）───────── */
function mktCards(){
  const ix=D.index||{}, one=(k,name)=>{
    const b=(ix[k]||{}).bars||[]; if(b.length<2) return "";
    const a=b[b.length-1], p=b[b.length-2], d=a[4]-p[4], r=d/p[4]*100, cls=d>0?"c-strong":d<0?"c-weak":"mute";
    const fx=v=>v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
    return `<div class="mkc"><div class="mute">${name}<span class="mkd">${a[0].slice(5).replace("-","/")} 收盤</span></div><div class="mkv">${fx(a[4])}</div><div class="${cls}">${d>0?"▲":d<0?"▼":""}${fx(Math.abs(d))}（${d>0?"+":""}${r.toFixed(2)}%）</div><div class="mute">成交金額 ${Math.round(a[5]).toLocaleString("en-US")} 億</div></div>`;
  };
  const inst=()=>{
    const I=D.inst, nm=`<div class="mute">三大法人買賣超（僅上市）`;
    if(!I) return `<div class="mkc mkx">${nm}</div><div class="mute">約 15:00～16:00 公布，稍後更新</div></div>`;
    const old=I.date!==D.asof, f=v=>(v>0?"+":"")+v.toFixed(1), c=v=>v>0?"c-strong":v<0?"c-weak":"mute";
    const mx=Math.max(1,...["foreign","trust","dealer"].map(k=>Math.abs(I[k])));
    const bar=(t,k)=>`<div class="mki"><span>${t}</span><span class="swtr"><i class="${I[k]>=0?"bg-s":"bg-w"}" style="width:${Math.abs(I[k])/mx*100}%"></i></span><span class="${c(I[k])}">${f(I[k])}</span></div>`;
    return `<div class="mkc mkx"${old?' style="opacity:.6"':""}>${nm}<span class="mkd">${I.date.slice(5).replace("-","/")} 上市${old?"（前一日）":""}</span></div><div class="mkv ${c(I.total)}">${f(I.total)} 億</div>${bar("外資","foreign")}${bar("投信","trust")}${bar("自營商","dealer")}</div>`;
  };
  const fut=()=>{
    const F=D.fut, nm=`<div class="mute">外資台指期淨未平倉（大台）`;
    if(!F) return `<div class="mkc">${nm}</div><div class="mute">約 15:00～16:00 公布，稍後更新</div></div>`;
    const old=F.date!==D.asof, short=F.net<0, cls=short?"c-weak":"c-strong", fx=v=>Math.abs(v).toLocaleString("en-US");
    let chg='<div class="mute">較前日：資料不足</div>';
    if(F.chg!=null){const more=(F.chg<0)===short; chg=F.chg===0?'<div class="mute">較前日持平</div>':`<div class="${(F.chg<0)?"c-weak":"c-strong"}">較前日${short?"空單":"多單"}${more?"增":"減"} ${fx(F.chg)} 口</div>`}
    return `<div class="mkc"${old?' style="opacity:.6"':""}>${nm}<span class="mkd">${F.date.slice(5).replace("-","/")} 日盤後${old?"（前一日）":""}</span></div><div class="mkv ${cls}">${short?"淨空":"淨多"} ${fx(F.net)} 口</div>${chg}</div>`;
  };
  const h=(D.market==="US"?"":inst()+fut());
  return h?`<div class="mkr">${h}</div>`:"";
}
/* ───────── 盤後一眼看懂：匯率、原油、美債（美股頁：美股指數＋VIX）。資料來自 Worker /api/macro，標資料時間 ───────── */
function loadMacro(){
  const el=document.getElementById("macro"); if(!el) return;
  const US=D.market==="US";

function fuzzyStocks(t,all){

  const bg=x=>{const r=new Set();for(let i=0;i<x.length-1;i++)r.add(x.slice(i,i+2));return r};
  const dice=(a,b)=>{const A=bg(a),B=bg(b);if(!A.size||!B.size)return 0;let n=0;A.forEach(g=>{if(B.has(g))n++});return 2*n/(A.size+B.size)};
  const ov=(a,b)=>{const B=new Set(b);let n=0;for(const c of new Set(a))if(B.has(c))n++;return n/Math.max(new Set(a).size,new Set(b).size)};
  const ed1=(a,b)=>{if(a===b)return true;if(Math.abs(a.length-b.length)>1)return false;
    if(a.length===b.length){let d=[];for(let i=0;i<a.length;i++)if(a[i]!==b[i])d.push(i);return d.length===1||(d.length===2&&d[1]===d[0]+1&&a[d[0]]===b[d[1]]&&a[d[1]]===b[d[0]])}
    const [s,l]=a.length<b.length?[a,b]:[b,a];for(let i=0;i<l.length;i++)if(l.slice(0,i)+l.slice(i+1)===s)return true;return false};
  const sc=[];
  for(const s of all){
    const n=nz(s.name), c=s.code.toLowerCase(); let v=0;
    if(q.length>=3&&q.length<=7&&/^[0-9a-z]+$/.test(q)&&/^[0-9a-z]+$/.test(c)&&ed1(q,c)) v=0.9;                   // 代號差一碼
    if(n.length>=2&&q.includes(n)&&q!==n) v=Math.max(v,0.85);                                                     // 多打字：「台積電公司」含「台積電」
    if(q.length>=3&&n.length>=3){const d=dice(q,n);if(d>=0.5)v=Math.max(v,d)}
    else if(/[一-鿿]/.test(q)&&q.length>=3){}
    if(q.length>=3&&/[一-鿿]/.test(q)&&Math.abs(q.length-n.length)<=1&&ov(q,n)>=0.66) v=Math.max(v,0.7*ov(q,n));    // 少打／錯一個字
    if(v>0) sc.push([v,s]);
  }
  sc.sort((a,b)=>b[0]-a[0]||(b[1].close*b[1].vol)-(a[1].close*a[1].vol));
  const r=sc.slice(0,3).map(x=>x[1]); r.fz=true; return r;
}

    else{const x=out[out.length-1];x.d=b.d;x.h=Math.max(x.h,b.h);x.l=Math.min(x.l,b.l);x.c=b.c;x.v+=b.v}

}

function kdRuns(K,minLen=3,hiTh=80,loTh=20){
  const segs=[];let a=-1,t=null;

  for(let i=0;i<K.length;i++){
    const ty=K[i]>=hiTh?"hi":K[i]<=loTh?"lo":null;
    if(ty!==t){flush(i);if(ty){a=i;t=ty}}

function calcDMI(bars,n=14){
  const N=bars.length,pdi=Array(N).fill(null),mdi=Array(N).fill(null),adx=Array(N).fill(null);
  if(N<=n*2) return{pdi,mdi,adx};

  for(let i=1;i<N;i++){const up=bars[i].h-bars[i-1].h,dn=bars[i-1].l-bars[i].l;
    P[i]=up>dn&&up>0?up:0;M[i]=dn>up&&dn>0?dn:0;
    T[i]=Math.max(bars[i].h-bars[i].l,Math.abs(bars[i].h-bars[i-1].c),Math.abs(bars[i].l-bars[i-1].c))}

   前低＝最低價比前後各 5 根都低；回測＝之後最低價落在前低以上 3% 內、或刺破前低但收盤仍在前低之上（且距上次觸及至少 5 根）；
   收盤價低於前低＝跌破（作廢）。已確認＝至少回測 1 次且到最新一根都沒破。有多條只取股價下方最近的一條。 */
function findSupport(B,vs,e){
  if(e<10) return null;
  const lastC=B[e].c;

    let best=null;
    for(let j=Math.max(a,5);j<=e-5;j++){

      for(let k=j-5;k<=j+5;k++){ if(k!==j&&B[k].l<L){ok=false;break} }
      if(!ok) continue;
      let broken=false,touches=1,last=j;
      for(let i=j+1;i<=e;i++){
        if(B[i].c<L){broken=true;break}
        const hit=B[i].l<L||B[i].l<=L*1.03;
        if(hit&&i-last>=5){touches++;last=i}
      }
      if(broken||touches<2||!(L<lastC)) continue;

  build(){

      this.btn("geo","形態",this.geo,`style="color:${this.geo?"#1E40AF":"#4D7CFF"};font-weight:700"`);      // 開啟（黃底）用深藍、關閉（黑底）用亮一點的藍才看得清楚

    const B0=this.bars,dmin=B0.length?B0[0].d:"",dmax=B0.length?B0[B0.length-1].d:"";
    const list=this.listOpen?`<div class="rangebar" style="flex-wrap:wrap"><span style="flex:none">起</span><input type="date" id="cr-from" min="${dmin}" max="${dmax}" value="${this.crFrom||""}"><span style="flex:none">止</span><input type="date" id="cr-to" min="${dmin}" max="${dmax}" value="${this.crTo||dmax}"><button class="btn on" data-a="crapply">套用</button><button class="btn" data-a="crsave">儲存</button></div>
      <div class="chips">${this.custom.length?this.custom.map((r,i)=>`<span class="chip2"><button class="btn" data-a="use-${i}">${MD(r.from)}～${MD(r.to)}</button><button class="btn" data-a="del-${i}" title="刪除">×</button></span>`).join(""):'<span class="mute" style="font-size:12px">輸入起止日期後按「套用」看這段的統計；按「儲存」留下來，下次可以直接點。</span>'}</div>`:"";

  act(a){

    if(a==="list"){this.listOpen=!this.listOpen;return this.build()}
    if(a==="scissor"){this.scMode=this.scMode?null:"menu";this.range=null;return this.build()}
    if(a==="sc-box"||a==="sc-zoom"){this.scMode=a==="sc-box"?"box":"zoom";this.range=null;return this.build()}
    if(a==="boxon"){this.boxOn=!this.boxOn;return this.build()}
    if(a==="draw"){this.drMode=this.drMode?null:"menu";this.drPts=[];this.drForm=false;this.scMode=null;return this.build()}
    if(a==="dr-poly"||a==="dr-line"||a==="dr-hline"){this.drMode=a.slice(3);this.drPts=[];return this.build()}
    if(a==="dr-done"){if(this.drPts.length>=2){this.drForm=true;this.build()}return}
    if(a==="dr-cancel"){this.cancelTools();return}
    if(a==="dr-save"){
      const nm=(this.el.querySelector("#dr-name")||{}).value||"", nt=(this.el.querySelector("#dr-note")||{}).value||"";
      if(!nm.trim()){alertBox(this.el,"請輸入型態名稱");return}
      const pts=this.drPts.filter((p,k,a)=>!k||p[0]!==a[k-1][0]||p[1]!==a[k-1][1]);      // 連點兩下重複的點只留一個
      const d={id:Date.now().toString(36),kind:this.drMode,name:nm.trim(),note:nt.trim(),pts};
      this.saveDrawings([...this.drawings,d]); this.drMode=null;this.drPts=[];this.drForm=false;return this.build()}
    if(a.startsWith("drdel-")){const id=a.slice(6);this.saveDrawings(this.drawings.filter(d=>d.id!==id));return this.build()}

      const ia=this.bars.findIndex(b=>b.d>=f), ib=(()=>{let k=-1;this.bars.forEach((b,i)=>{if(b.s<=t)k=i});return k})();

  fit(a,b){const N=this.bars.length,span=b-a+1;this.n=Math.max(15,Math.min(N,span+6));this.end=Math.min(N,Math.max(this.n,b+3));this.draw()}
  useRange(r){const a=idxOf(this.bars,r.from),b=idxOf(this.bars,r.to);if(a<0||b<0)return;this.active=r;this.range=null;this.fit(a,b)}
  saveRange(){

  clear(){ if(this.cancelScissor()) return; if(this.sel!=null){this.sel=null;this.draw()} }

  panTo(startVs,dx){const g=this.geom(),px=this.rect().width/g.W,N=this.bars.length;const vs=Math.max(0,Math.min(N-this.n,startVs-Math.round(dx/(g.cw*px))));this.end=vs+this.n;this.draw()}
  pd(e){
    try{e.currentTarget.setPointerCapture(e.pointerId)}catch(_){}
    this.ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(this.drMode&&this.drMode!=="menu"&&!this.drForm){            // 畫線模式：點一下加一個點

      if(need&&this.drPts.length>=need){this.drForm=true;this.build()} else this.draw();
      return;
    }
    if(e.pointerType==="mouse"){
      if(e.button!==0) return;

    }
    if(this.ptrs.size>=2){this.cancelHold();this.tstate=null;this.drawing=false;this.startPinch();return}
    if(this.scMode==="box"||this.scMode==="zoom"){this.startRange(e);return}
    this.tstate={x:e.clientX,vs:this.geom().vs,mode:"wait"};
    this.lastX=e.clientX;
    clearTimeout(this.holdTimer);
    this.holdTimer=setTimeout(()=>{
      if(this.tstate&&this.tstate.mode==="wait"){this.tstate.mode="hold";this.sel=this.indexAtX(this.lastX);this.draw();try{navigator.vibrate&&navigator.vibrate(8)}catch(_){}}

  }
  pm(e){
    const p=this.ptrs.get(e.pointerId); if(p){p.x=e.clientX;p.y=e.clientY}
    this.lastX=e.clientX;
    if(e.pointerType==="mouse"){
      if(this.drawing){this.range.b=this.indexAt(e);this.range.p1=this.priceAt(e);this.draw();return}
      if(!this.drag) return;
      const dx=e.clientX-this.drag.x;
      if(Math.abs(dx)>4) this.drag.moved=true;
      if(this.drag.moved) this.panTo(this.drag.vs,dx);
      return;
    }
    if(this.pinch&&this.ptrs.size>=2){this.doPinch();return}
    if(this.drawing){this.range.b=this.indexAt(e);this.range.p1=this.priceAt(e);this.draw();return}
    const st=this.tstate; if(!st) return;
    const dx=e.clientX-st.x;
    if(st.mode==="wait"&&Math.abs(dx)>8){this.cancelHold();st.mode="pan"}

    else if(st.mode==="hold"){this.sel=this.indexAt(e);this.draw()}
  }
  pu(e){
    this.ptrs.delete(e.pointerId);
    if(e.pointerType==="mouse"){
      if(this.drawing){this.finishRange();return}
      const d=this.drag;this.drag=null;
      if(d&&!d.moved){this.sel=this.indexAt(e);this.draw()}
      return;
    }
    this.cancelHold();
    if(this.drawing){this.finishRange();return}
    if(this.pinch&&this.ptrs.size<2) this.pinch=null;
    const st=this.tstate;this.tstate=null;
    if(st&&st.mode==="wait"&&this.sel!=null){this.sel=null;this.draw()}      // 已顯示 K 棒資訊時，點一下圖就關閉；長按放開後則持續顯示
  }
  pc(e){this.ptrs.delete(e.pointerId);this.cancelHold();this.drag=null;this.tstate=null;this.pinch=null;this.drawing=false;this.draw()}
  cancelHold(){clearTimeout(this.holdTimer)}
  startPinch(){const [a,b]=[...this.ptrs.values()];const g=this.geom(),mx=(a.x+b.x)/2,idx=this.indexAtX(mx);this.sel=null;this.pinch={d0:Math.hypot(a.x-b.x,a.y-b.y)||1,n0:this.n,idx,frac:(idx-g.vs)/g.n}}
  doPinch(){
    const [a,b]=[...this.ptrs.values()],p=this.pinch,N=this.bars.length;
    const d=Math.hypot(a.x-b.x,a.y-b.y)||1;
    const n=Math.max(15,Math.min(N,Math.round(p.n0*p.d0/d)));
    const vs=Math.max(0,Math.min(N-n,Math.round(p.idx-p.frac*n)));

  }
  wheel(e){

  priceAt(e){const g=this.pg;if(!g)return null;const r=this.rect(),yy=(e.clientY-r.top)/r.height*this.H;return g.hi-(yy-g.pt)/(g.priceBot-g.pt)*(g.hi-g.lo)}
  startRange(e){const i=this.indexAt(e),p=this.priceAt(e);this.range={a:i,b:i,p0:p,p1:p};this.drawing=true;this.sel=null;this.draw()}

    const hi=Math.max(R.p0,R.p1),lo=Math.min(R.p0,R.p1);

    saveBoxes(this.s.code,this.cboxes); this.scMode=null; this.build();
  }
  cancelScissor(){ return this.cancelTools() }
  cancelTools(){ if(!this.scMode&&!this.drMode) return false; this.scMode=null; this.drMode=null; this.drPts=[]; this.drForm=false; this.range=null; this.drawing=false; this.build(); return true }
  saveDrawings(list){
    this.drawings=list; this.draw();
    fetch(`/api/draw?m=${D.market==="US"?"US":"TW"}&c=${encodeURIComponent(this.s.code)}`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(list)})
      .then(r=>{if(!r.ok) alertBox(this.el,r.status===403?"登入已過期，請重新登入管理者專區後再存":"儲存失敗，請再試一次")}).catch(()=>alertBox(this.el,"儲存失敗，請檢查網路"));
  }
  idxOfDate(d){const B=this.bars;let lo=0,hi=B.length-1;if(!B.length)return -1;if(d<=B[0].d)return 0;if(d>B[hi].d)return hi;
    while(lo<hi){const m=(lo+hi)>>1;if(B[m].d<d)lo=m+1;else hi=m}return lo}

  draw(){
    const cv=this.cv; if(!cv) return;
    const W=Math.max(320,cv.clientWidth), H=Math.max(cv.clientWidth<600?140:260,cv.clientHeight);
    this.W=W; this.H=H;
    const {pl,pr,vs,cw}=this.geom(), B=this.bars, ve=this.end, s=this.s;
    const subs=["dmi","kd","macd"].filter(k=>this.ind[k]);
    const SHEAD=17, SGAP=5, nsub=subs.length;
    const SH=nsub?Math.max(48,Math.min(110,Math.floor(H*(nsub>=3?0.115:nsub===2?0.14:0.17)))):0;
    const mainH=H-nsub*(SH+SHEAD+SGAP);
    const AX=16, pt=8, hasVol=this.bars.some(b=>b.v>0);
    const VH=hasVol?Math.round(mainH*0.13):0;
    const priceBot=mainH-AX-VH-(hasVol?6:0);
    const vis=B.slice(vs,ve);
    let hi=Math.max(...vis.map(b=>b.h)), lo=Math.min(...vis.map(b=>b.l));
    const bx=s.box?{...s.box,hi:this.adjOn&&s.box.hiA!=null?s.box.hiA:s.box.hi,lo:this.adjOn&&s.box.loA!=null?s.box.loA:s.box.lo}:null;
    if(bx && this.boxOn && idxOf(B,bx.s)<ve && (bx.live||idxOf(B,bx.e)>=vs)){hi=Math.max(hi,Math.min(bx.hi,hi*1.3));lo=Math.min(lo,Math.max(bx.lo,lo*0.75))}
    for(const n of MA_ALL) if(this.maOn[n]) for(let i=vs;i<ve;i++){const v=this.ma[n][i];if(v!=null&&v>lo*0.7&&v<hi*1.3){hi=Math.max(hi,v);lo=Math.min(lo,v)}}
    if(this.few()){const c=B[B.length-1].c,need=c*.3;if(hi-lo<need){const m=(hi+lo)/2;hi=m+need/2;lo=m-need/2}}   /* 新股 K 棒很少：價格範圍至少放到現價 30%，K 棒才是正常大小（11/16 使用者） */
    const pad=(hi-lo)*.07||1; hi+=pad; lo-=pad;
    const y=v=>pt+(hi-v)/(hi-lo)*(priceBot-pt), x=i=>pl+(i-vs)*cw+cw/2;

const fesc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const FUNDS_HELP="資料來源：美國期貨交易委員會（CFTC）每週五公布的期貨持倉報告，取其中「槓桿基金」（主要是對沖基金與趨勢型基金）在指數期貨的多單與空單。資料日是週二，週五才公布，所以一定晚幾天。\n\n重點提醒：這只看期貨，看不到它們的股票部位。對沖基金常常「股票做多、期貨放空來避險」，所以期貨淨空單很大，不代表它們看空。請看「跟自己過去一年比」的位置，不要看絕對數字，也不是買賣建議。";
const FUNDS_RATIO_HELP="多單 ÷ 空單＝槓桿基金的多單口數除以空單口數。\n• 等於 1：多單和空單一樣多。\n• 大於 1：多單比空單多，數字越大越偏多。\n• 小於 1：空單比多單多，數字越小越偏空。\n\n注意：每種期貨平常的水準不同。例如標普 500 期貨常常遠小於 1，因為對沖基金常拿它來避險，所以不要只看大於或小於 1，要看卡片上寫的「近一年範圍」：現在的數字靠近最大值，代表近一年來最偏多；靠近最小值，代表近一年來最偏空；在中間就是普通。";
function fundsGeom(S){const seg=S.rows.slice(-156).map(r=>r[1]-r[2]), lo=Math.min(0,...seg), hi=Math.max(0,...seg), W=600, H=130;
  return {seg,lo,hi,W,H,x:i=>i/(seg.length-1)*W,y:v=>6+(1-(v-lo)/(hi-lo||1))*(H-12)}}
function fundsHover(card,S){

  const show=e=>{const r=box.getBoundingClientRect(); let i=Math.round((e.clientX-r.left)/r.width*(rows.length-1)); i=Math.max(0,Math.min(rows.length-1,i));

    line.style.left=px+"%"; line.hidden=false; dot.style.left=px+"%"; dot.style.top=py+"%"; dot.hidden=false;
    tip.innerHTML=`<b>${a[0]}</b><br>淨口數 <b style="color:${nt<0?"#4ade80":"#f87171"}">${fm(nt)}</b><br>多 ${a[1].toLocaleString()}　空 ${a[2].toLocaleString()}<br>多空比 <b style="color:${ra<1?"#4ade80":"#f87171"}">${ra.toFixed(2)}</b>`;
    tip.hidden=false; const w=tip.offsetWidth; tip.style.left=((e.clientX-r.left)>r.width/2?4:Math.max(4,r.width-w-4))+"px";};   /* 說明框放在游標的另一側，不擋住正在看的那一段 */
  const hide=()=>{line.hidden=dot.hidden=tip.hidden=true};

  box.addEventListener("pointermove",e=>{if(e.pointerType==="mouse"||e.buttons||e.pressure>0)show(e)});

  box.addEventListener("pointerup",e=>{if(e.pointerType==="mouse")return});
}

  let zm=$("#lzoom"); if(!zm){zm=document.createElement("div");zm.id="lzoom";document.body.appendChild(zm);zm.onclick=()=>zm.classList.remove("on")}
  const zoom=svg=>{zm.innerHTML='<button class="lxx lzx" aria-label="關閉">✕</button>'+svg.outerHTML;zm.classList.add("on")};
  document.querySelectorAll(".lcard .lsv").forEach(v=>v.onclick=()=>zoom(v));
  /* 手機：讀到哪一型態，圖捲出畫面後縮小貼左邊，換到下一型態才換圖（11/16 使用者） */
  let dk=$("#ldock"); if(!dk){dk=document.createElement("div");dk.id="ldock";document.body.appendChild(dk)}
  dk.onclick=()=>{const v=dk.querySelector(".lsv");if(v)zoom(v)};
  let cur=null;
  const dock=()=>{
    if(!document.querySelector(".lsb")){dk.classList.remove("on");removeEventListener("scroll",dock);return}
    if(!matchMedia("(max-width:700px)").matches){if(cur){cur.classList.remove("dk");cur=null}dk.classList.remove("on");return}
    const top=document.querySelector(".lsb").getBoundingClientRect().bottom;
    let hit=null;
    for(const c of document.querySelectorAll(".lcard")){ if(c.style.display==="none") continue;
      const r=c.getBoundingClientRect(), v=c.querySelector(".lsv").getBoundingClientRect();
      if(v.bottom<top+10 && r.bottom>top+150){hit=c;break} }
    if(hit===cur) return;
    /* 加減左邊空間會讓文字高度改變；以畫面中的卡片位置為錨點，改完把捲動補回去 */
    const anc=[...document.querySelectorAll(".lcard")].find(c=>c.getBoundingClientRect().bottom>top), a0=anc?anc.getBoundingClientRect().top:0;
    if(cur) cur.classList.remove("dk");
    cur=hit;
    if(hit){hit.classList.add("dk");dk.innerHTML=hit.querySelector(".lsv").outerHTML;dk.style.top=(top+8)+"px";dk.classList.add("on")} else dk.classList.remove("on");
    if(anc){const d=anc.getBoundingClientRect().top-a0; if(Math.abs(d)>1) window.scrollBy(0,d)}
  };
  addEventListener("scroll",dock,{passive:true});
  /* 搜尋框黏在頁首下面（頁首高度會變，跟著調） */
  const sb=document.querySelector(".lsb"), hd=document.querySelector("header"), z=parseFloat($("#app").style.zoom)||1;
  const fit=()=>{if(sb.isConnected) sb.style.top=(hd.getBoundingClientRect().height/z)+"px"};
  fit(); if(window.ResizeObserver) new ResizeObserver(fit).observe(hd);
}

window.onhashchange = route; route();
</script>
</body>
