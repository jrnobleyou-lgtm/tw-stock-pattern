name: free-test
on:
  push:
    branches: [claude/zealous-johnson-tpqrow]
    paths: [tmp_test/**, .github/workflows/free-test.yml]
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: python3 tmp_test/run_free.py
        env:
          CI: "1"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT }}
