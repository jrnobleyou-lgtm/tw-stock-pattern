name: gpt-test
on:
  push:
    branches: [claude/zealous-johnson-tpqrow]
    paths: [tmp_test/**, .github/workflows/gpt-test.yml]
permissions:
  contents: read
  models: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tmp_test/raw.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
