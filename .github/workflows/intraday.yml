name: intraday
on:
  schedule:
    - cron: '50 0 * * 1-5'      # 台灣時間 08:50 啟動盤中循環（到 13:50 結束）
    - cron: '25 1 * * 1-5'      # 備援：若上面那次被 GitHub 略過，09:25 再啟動一次（已在跑就會排隊後直接結束）
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: intraday-loop
  cancel-in-progress: false
env:
  SITE_URL: https://news-findstockpattern-swing-breakout.news-stockpatten.workers.dev
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 盤中循環
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/intraday_loop.sh
