name: weekly-adjust
on:
  schedule:
    - cron: '0 21 * * 6'            # 台灣時間 週日 05:00
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  adjust:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/weekly_adjust.py
      - name: 提交並重新部署
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/adjust.csv
          git diff --cached --quiet || (git commit -m "weekly adjust $(date -u +%F)" && git push)
          gh workflow run update.yml
