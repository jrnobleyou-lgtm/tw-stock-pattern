name: update
on:
  schedule:
    - cron: '10,40 7-9 * * 1-5'     # 上櫃：台灣時間 週一～週五 15:10 / 15:40 / 16:10 / 16:40 / 17:10 / 17:40
    - cron: '*/30 22-23 * * 1-5'    # 上市：台灣時間 週二～週六 06:00 / 06:30 / 07:00 / 07:30（抓前一個交易日）
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/index.html', 'site/worker.js', 'site/wrangler.jsonc', 'site/.assetsignore', 'site/*.png', 'site/*.jpg', 'scripts/**', 'data/groups_tw_all.csv', '.github/workflows/update.yml']
permissions:
  contents: write
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 抓最新資料（缺什麼補什麼）
        run: python3 scripts/daily_update.py
      - name: 有沒有新資料
        id: chg
        run: |
          if [ -n "$(git status --porcelain data)" ] || [ "${{ github.event_name }}" != "schedule" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
      - name: 組價格並分析
        if: steps.chg.outputs.changed == 'true'
        run: |
          python3 scripts/build_prices.py
          python3 scripts/analyze.py all
      - name: 提交資料
        if: steps.chg.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/hist data/adjust.csv data/pending_ex.csv data/index_TWII.json data/index_OTC.json
          git diff --cached --quiet || (git commit -m "data $(date -u +%F)" && git push)
      - name: 發布到 deploy 分支（Cloudflare Pages 會自動從這個分支發布）
        if: steps.chg.outputs.changed == 'true'
        run: |
          rm -rf /tmp/pub && mkdir /tmp/pub && cp -r site/. /tmp/pub/
          rm -f /tmp/pub/preview.html /tmp/pub/index_v1.html
          cd /tmp/pub
          git init -q -b deploy
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "build $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" deploy
